plugins {
    id 'com.android.application'
}

android {
    namespace 'com.opencode.freeapi'
    compileSdk 34
    ndkVersion "28.1.13356709"

    defaultConfig {
        applicationId "com.opencode.freeapi"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.5"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/**']
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
