plugins {
    id 'com.android.application'
}

android {
    namespace 'com.opencode.freeapi'
    compileSdk 34
    ndkVersion "28.1.13356709"

    defaultConfig {
        applicationId "com.opencode.freeapi"
        minSdk 24
        targetSdk 34
        versionCode 302
        versionName "0.3.1-fix"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/**']
        }
        jniLibs {
            // 必须为 true：二进制以可执行文件方式运行（ProcessBuilder），
            // 依赖系统把 so 解压到 nativeLibraryDir；false 时不解压，启动直接失败
            useLegacyPackaging = true
        }
    }
}
