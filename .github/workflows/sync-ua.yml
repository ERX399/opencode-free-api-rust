name: Sync opencode UA version

on:
  schedule:
    - cron: '0 2 * * *'  # daily 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-ua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch latest opencode-ai version and update default UA
        run: |
          set -euo pipefail
          VERSION="$(curl -fsSL https://registry.npmjs.org/opencode-ai/latest | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          echo "latest opencode-ai version: ${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          if grep -q 'const DEFAULT_USER_AGENT: &str = "opencode/' src/main.rs; then
            sed -i -E "s|const DEFAULT_USER_AGENT: &str = \"opencode/[0-9.]+\";|const DEFAULT_USER_AGENT: \&str = \"opencode/${VERSION}\";|" src/main.rs
            git diff -- src/main.rs || true
          else
            echo "DEFAULT_USER_AGENT const not found; skipping"
          fi
      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- src/main.rs; then
            echo "No UA change; done"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs
          git commit -m "chore: sync default User-Agent to opencode/${VERSION}"
          git push