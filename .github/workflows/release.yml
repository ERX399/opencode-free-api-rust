name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install rustup and targets
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add \
            x86_64-pc-windows-gnu \
            x86_64-unknown-linux-musl \
            aarch64-unknown-linux-musl \
            x86_64-apple-darwin \
            aarch64-apple-darwin \
            aarch64-linux-android \
            x86_64-linux-android

      - name: Install Android NDK
        run: |
          ndk_version="r28b"
          curl -sSL -o /tmp/ndk.zip \
            https://dl.google.com/android/repository/android-ndk-${ndk_version}-linux.zip
          unzip -q /tmp/ndk.zip -d /opt
          echo "ANDROID_NDK_HOME=/opt/android-ndk-${ndk_version}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=/opt/android-ndk-${ndk_version}" >> "$GITHUB_ENV"
          # Wire cc cargo wrappers for cargo-zigbuild/android targets
          ndk_toolchain="/opt/android-ndk-${ndk_version}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo '[target.aarch64-linux-android]'
            echo "linker = \"${ndk_toolchain}/aarch64-linux-android24-clang\""
            echo '[target.x86_64-linux-android]'
            echo "linker = \"${ndk_toolchain}/x86_64-linux-android24-clang\""
          } >> "$HOME/.cargo/config.toml"

      - name: Install zig
        run: |
          curl -sSL -o /tmp/zig.tar.xz \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          tar -xf /tmp/zig.tar.xz -C /opt
          echo "/opt/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo install cargo-zigbuild --locked

      - name: Build all targets
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          # Android targets use NDK clang directly (not zigbuild)
          for t in \
            x86_64-pc-windows-gnu \
            x86_64-unknown-linux-musl \
            aarch64-unknown-linux-musl \
            x86_64-apple-darwin \
            aarch64-apple-darwin; do
            cargo zigbuild --release --target "$t"
          done
          # NDK r23+ ships only API-level-suffixed clang wrappers
          # (e.g. aarch64-linux-android24-clang); cc-rs / ring look up
          # CC_<target> and AR_<target>, so wire them explicitly.
          tc="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$tc/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="$tc/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$tc/llvm-ar"
          export CC_x86_64_linux_android="$tc/x86_64-linux-android24-clang"
          export CXX_x86_64_linux_android="$tc/x86_64-linux-android24-clang++"
          export AR_x86_64_linux_android="$tc/llvm-ar"
          cargo build --release --target aarch64-linux-android
          cargo build --release --target x86_64-linux-android

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/opencode-free-api \
             dist/opencode-free-api-linux-x86_64
          cp target/aarch64-unknown-linux-musl/release/opencode-free-api \
             dist/opencode-free-api-linux-aarch64
          cp target/x86_64-pc-windows-gnu/release/opencode-free-api.exe \
             dist/opencode-free-api-windows-x86_64.exe
          cp target/x86_64-apple-darwin/release/opencode-free-api \
             dist/opencode-free-api-macos-x86_64
          cp target/aarch64-apple-darwin/release/opencode-free-api \
             dist/opencode-free-api-macos-arm64
          cp target/aarch64-linux-android/release/opencode-free-api \
             dist/opencode-free-api-android-arm64
          cp target/x86_64-linux-android/release/opencode-free-api \
             dist/opencode-free-api-android-x86_64
          chmod +x dist/*
          sudo apt-get update -qq && sudo apt-get install -y -qq upx zip
          upx --best -q dist/opencode-free-api-linux-x86_64
          upx --best -q dist/opencode-free-api-linux-aarch64
          upx --best -q dist/opencode-free-api-windows-x86_64.exe
          # Android binaries are not UPX-compressed: UPX runtime stubs trip
          # Android 10+ W^X memory protection and fail to launch.

      - name: Package archives
        run: bash scripts/make_packages.sh

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" packages/* --clobber
          gh release upload "$GITHUB_REF_NAME" android/app/build/outputs/apk/*/*.apk --clobber || true

  apk:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          ndk_version="r28b"
          curl -sSL -o /tmp/ndk.zip \
            https://dl.google.com/android/repository/android-ndk-${ndk_version}-linux.zip
          unzip -q /tmp/ndk.zip -d /opt
          echo "ANDROID_NDK_HOME=/opt/android-ndk-${ndk_version}" >> "$GITHUB_ENV"
          ndk_toolchain="/opt/android-ndk-${ndk_version}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo '[target.aarch64-linux-android]'
            echo "linker = \"${ndk_toolchain}/aarch64-linux-android24-clang\""
          } >> "$HOME/.cargo/config.toml"

      - name: Install rustup and android target
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add aarch64-linux-android

      - name: Build Rust binary for Android arm64
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          tc="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$tc/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$tc/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$tc/aarch64-linux-android24-clang"
          cargo build --release --target aarch64-linux-android
          mkdir -p android/app/src/main/assets
          cp target/aarch64-linux-android/release/opencode-free-api \
             android/app/src/main/assets/opencode-free-api

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_HOME: $ANDROID_SDK_ROOT

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" android/app/build/outputs/apk/release/*.apk --clobber || true
