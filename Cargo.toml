[package]
name = "opencode-free-api"
version = "0.1.5"
edition = "2024"
license = "MIT"
description = "Small OpenAI-compatible failover proxy for free models"
repository = "https://github.com/ERX399/opencode-free-api-rust"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
tiny_http = "0.12"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
overflow-checks = false
